<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Victory Tuition Centre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" id="fav" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #fff7e0; --card: #fff; --tx: #12203d; --mu: #667592; --bd: #f1e2b4;
      --pr: #2f5bea; --gd: #ffc400; --ok: #0e9f6e; --wn: #e8590c; --no: #e11d48;
      --fd: Orbitron, "Segoe UI", system-ui, sans-serif;
      --fb: Poppins, "Segoe UI", system-ui, sans-serif;
      color-scheme: light; box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0a1226; --card: #121d38; --tx: #eaf0ff; --mu: #93a3c4; --bd: #22325a;
        --pr: #7ea0ff; --ok: #34d399; --wn: #fb923c; --no: #fb7185; color-scheme: dark;
      }
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(800px 380px at 100% -5%, color-mix(in srgb, var(--gd) 28%, transparent), transparent), var(--bg);
      color: var(--tx); font: 15px/1.55 var(--fb);
    }
    .app { display: flex; min-height: 100vh; }
    nav { width: 232px; background: linear-gradient(180deg, #0b1b3a, #13265a); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .brand { display: flex; gap: 10px; align-items: center; color: #fff; font: 800 13px var(--fd); margin-bottom: 14px; }
    .brand small { display: block; font: 400 10px var(--fb); color: #c9d4f5; margin-top: 2px; }
    .brand img { width: 66px; height: 66px; border-radius: 14px; object-fit: contain; background: #fffaf0; border: 2px solid var(--gd); flex-shrink: 0; }
    nav a { padding: 10px 12px; border-radius: 10px; cursor: pointer; color: #cdd8f7; white-space: nowrap; text-decoration: none; transition: background 0.15s; }
    nav a:hover { background: rgba(255, 255, 255, 0.08); }
    nav a.on { background: linear-gradient(135deg, #ffc400, #ff9f1c); color: #1b1b1b; font-weight: 600; }
    .who { margin-top: auto; color: #8fa0d0; text-transform: capitalize; font-size: 12px; padding-top: 10px; }
    main { flex: 1; padding: 24px; min-width: 0; max-width: 1000px; }
    h1, h2 { font-family: var(--fd); }
    h1 { margin: 0 0 16px; font-size: 22px; }
    h3 { margin: 0 0 10px; }
    .card { background: var(--card); border: 1px solid var(--bd); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(11, 27, 58, 0.07); }
    .hero { background: linear-gradient(120deg, #0b1b3a, #2f5bea 65%, #7c3aed); color: #fff; border-radius: 18px; padding: 22px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hero h2 { margin: 0; color: var(--gd); font-size: 20px; }
    .clk { font: 800 28px var(--fd); letter-spacing: 2px; color: #fff; text-shadow: 0 0 12px rgba(255, 196, 0, 0.7); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .stat { border-radius: 16px; padding: 14px; color: #fff; background: linear-gradient(135deg, #2f5bea, #7c3aed); }
    .stat:nth-child(2) { background: linear-gradient(135deg, #0e9f6e, #0891b2); }
    .stat:nth-child(3) { background: linear-gradient(135deg, #ea580c, #db2777); }
    .stat:nth-child(4) { background: linear-gradient(135deg, #0b1b3a, #475569); }
    .stat small { color: #e6ecff; }
    .stat b { display: block; font: 800 19px var(--fd); }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--bd); border-radius: 10px; background: var(--bg); color: var(--tx); font: inherit; margin-bottom: 8px; }
    textarea { min-height: 90px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .row > * { flex: 1; min-width: 130px; margin-bottom: 0; }
    .btn, .btn2 { border: 0; border-radius: 10px; padding: 10px 16px; font: 600 14px var(--fb); cursor: pointer; background: linear-gradient(135deg, #ffc400, #ff9f1c); color: #1b1b1b; text-decoration: none; display: inline-block; text-align: center; transition: transform 0.1s; }
    .btn:active, .btn2:active { transform: scale(0.98); }
    .btn2 { background: transparent; color: var(--pr); border: 1px solid var(--bd); }
    .btn-out { background: linear-gradient(135deg, #e11d48, #fb7185); color: #fff; }
    .btn-wa { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; }
    .mu, small { color: var(--mu); }
    a { color: var(--pr); cursor: pointer; }
    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--bd); font-size: 14px; white-space: nowrap; }
    th { background: color-mix(in srgb, var(--gd) 20%, transparent); font-size: 12px; text-transform: uppercase; }
    td.ok, td.no, td.hf { font-weight: 700; text-align: center; }
    td.ok { color: var(--ok); } td.no { color: var(--no); } td.hf { color: var(--wn); }
    tr.cur td { background: color-mix(in srgb, var(--gd) 22%, transparent); }
    tr.tot td { font-weight: 700; border-top: 2px solid var(--bd); }
    .tag { padding: 2px 10px; border-radius: 99px; font-size: 12px; margin-right: 4px; background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); display: inline-block; }
    .tag.p { background: color-mix(in srgb, var(--wn) 18%, transparent); color: var(--wn); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .chip { position: relative; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--bd); background: var(--bg); color: var(--tx); font: 600 13px var(--fb); cursor: pointer; user-select: none; }
    .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
    .chip.on { background: linear-gradient(135deg, #2f5bea, #7c3aed); color: #fff; border-color: transparent; }
    .mg { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
    .m { border-radius: 12px; padding: 8px; text-align: center; color: #fff; background: #94a3b8; }
    .m.ok { background: #0e9f6e; } .m.no { background: #e11d48; } .m.hf { background: #e8590c; }
    .m b { display: block; font: 600 13px var(--fd); } .m small { color: #fff; }
    video { width: 100%; max-height: 260px; background: #000; border-radius: 12px; margin-bottom: 8px; display: none; }
    .ov { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; z-index: 20; padding: 16px; overflow-y: auto; }
    .qc { text-align: center; margin: 0; max-width: 380px; width: 100%; max-height: 92vh; overflow-y: auto; }
    .qc #qr { display: grid; place-items: center; background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 8px; }
    .qc > img { width: 72px; height: 72px; border-radius: 14px; object-fit: contain; background: #fffaf0; border: 2px solid var(--gd); }
    .choose { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; }
    .choose img { width: min(190px, 54vw); height: auto; aspect-ratio: 697 / 693; object-fit: contain; border-radius: 22px; border: 3px solid var(--gd); background: #fffaf0; box-shadow: 0 8px 28px rgba(11, 27, 58, 0.2); margin-bottom: 8px; }
    .choose .grid { width: min(640px, 92vw); margin-top: 18px; }
    .choose .card { width: min(360px, 92vw); text-align: left; }
    .role { display: block; border-radius: 16px; padding: 20px; color: #fff; text-decoration: none; transition: transform 0.15s; }
    .role:hover { transform: translateY(-2px); }
    .role b { font: 800 18px var(--fd); display: block; } .role small { color: #fff; }
    .r1 { background: linear-gradient(135deg, #2f5bea, #7c3aed); }
    .r2 { background: linear-gradient(135deg, #0e9f6e, #0891b2); }
    .r3 { background: linear-gradient(135deg, #ea580c, #db2777); }
    #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #0b1b3a; color: #fff; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 30; max-width: 90%; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); }
    .toggle-group { display: flex; gap: 4px; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--bd); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
    .toggle-btn { flex: 1; border: 0; border-radius: 8px; padding: 8px; font: 600 13px var(--fb); cursor: pointer; background: transparent; color: var(--tx); text-align: center; }
    .toggle-btn.active-in { background: var(--ok); color: #fff; }
    .toggle-btn.active-out { background: var(--no); color: #fff; }
    .storage-bar { width: 100%; height: 10px; background: var(--bd); border-radius: 5px; overflow: hidden; margin: 8px 0; }
    .storage-fill { height: 100%; background: linear-gradient(90deg, #0e9f6e, #2f5bea); width: 100%; transition: width 0.3s; }
    .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: #34d399; font-weight: 600; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
    .bulk-box { background: color-mix(in srgb, #25D366 10%, var(--card)); border: 2px solid #25D366; }
    @media (max-width: 760px) {
      .app { flex-direction: column; }
      nav { width: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
      .brand, .who { display: none; }
      main { padding: 14px; }
      .clk { font-size: 20px; }
    }
    @media print {
      nav, .noprint, #toast { display: none !important; }
      .app { display: block; } main { max-width: none; padding: 0; }
      body { background: #fff; }
    }
  </style>
</head>

    const STORES = ["config", "notices", "students", "attendance", "fees", "alerts", "exams", "expenses", "tpay", "staff", "staffatt", "portal_info", "portal_att", "portal_fees", "portal_exams"];

    let cloudReady = false;
    const CACHE = {};
    STORES.forEach(s => CACHE[s] = new Map());

    function initCloudSync() {
      return new Promise((resolve) => {
        let loadedCount = 0;
        STORES.forEach(st => {
          rtdb.ref(st).on("value", snap => {
            CACHE[st].clear();
            const val = snap.val();
            if (val) {
              Object.entries(val).forEach(([k, v]) => {
                if (v && typeof v === "object") CACHE[st].set(k, { ...v, id: k });
              });
            }
            if (!cloudReady) {
              loadedCount++;
              if (loadedCount >= STORES.length) { cloudReady = true; syncArrays(); resolve(); }
            } else {
              syncArrays();
            }
          }, err => {
            console.error("Firebase Sync Error:", err);
            toast("Cloud connection issue: " + err.message);
            if (!cloudReady) { cloudReady = true; resolve(); }
          });
        });
      });
    }

    function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

    const db = {
      set(store, id, data) {
        const rec = { ...data, id };
        CACHE[store].set(id, rec);
        syncArrays();
        return rtdb.ref(`${store}/${id}`).set(rec).then(() => rec);
      },
      add(store, data) { return this.set(store, genId(), data); },
      update(store, id, partial) {
        const existing = CACHE[store].get(id);
        if (!existing) return Promise.resolve(null);
        const updated = { ...existing, ...partial };
        CACHE[store].set(id, updated);
        syncArrays();
        return rtdb.ref(`${store}/${id}`).update(partial).then(() => updated);
      },
      delete(store, id) {
        CACHE[store].delete(id);
        syncArrays();
        return rtdb.ref(`${store}/${id}`).remove();
      },
      get(store, id) { return CACHE[store].get(id) || null; },
      getAll(store) { return Array.from(CACHE[store].values()); }
    };

    let page = "", R = "", S = [], N = [], A = [], F = [], O = [], E = [], X = [], P = [], C = [], SA = [];
    let rm = "", stream = null, timer = null, last = { c: "", t: 0 }, rt = null, AH = undefined, SESS = { a: false, t: "" };
    let currentPortalCode = "";
    let scanMode = "in";

    const today = () => new Date().toLocaleDateString("en-CA");
    const month = () => today().slice(0, 7);

    const wa = p => {
      let d = String(p).replace(/\D/g, "");

      return d;
    };
    const role = () => {
      const h = location.hash.slice(1);

    };
    const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

      tp: "Teacher payments", rp: "Reports", al: "Parent alerts", ta: "My attendance",

    };
    const TABS = {

      teacher: ["at", "ta", "ex", "nb"],

    };

    function syncArrays() {
      N = db.getAll("notices");
      S = db.getAll("students");
      A = db.getAll("attendance");
      F = db.getAll("fees");
      O = db.getAll("alerts");

    const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
    const monthSum = (sid, m) => sum(F.filter(f => f.sid === sid && f.month === m), f => f.amount);
    const stat = (l, v, bg) => `<div class="stat"${bg ? ` style="background:${bg}"` : ""}><small>${l}</small><b>${v}</b></div>`;
    const lkr = n => (n < 0 ? "-" : "") + "LKR " + Math.abs(n).toLocaleString();

    // Money by month (YYYY-MM)
    const colM = k => sum(F.filter(f => f.month === k), f => f.amount);

    const tClasses = t => {

      if (c && typeof c === "object") return Object.values(c).filter(Boolean);
      return t && t.classGrade ? String(t.classGrade).split(",").map(x => x.trim()).filter(Boolean) : [];

    function markAtt(code) {
      code = String(code || "").trim().toUpperCase();

      if (code === last.c && Date.now() - last.t < 3000) return;
      last = { c: code, t: Date.now() };
      const s = S.find(x => x.code === code);
      if (!s) return toast("Unknown card: " + code);

      const studentGrade = s.grade || "Grade 6";
      const d = today(), id = d + "_" + s.id, cur = A.find(a => a.id === id), t = now(), pa = s.code + "_" + d, who = s.parent || "parent";

      if (scanMode === "in") {

          .then(() => {
            db.set("portal_att", pa, { code: s.code, date: d, in: t, out: cur ? cur.out : "" });

            toast("✓ " + s.name + " checked IN " + t);

        p = db.update("attendance", id, { out: t })

    }

    async function bio(t) {
      if (!window.PublicKeyCredential) return false;
      const k = "wa_" + t.id;
      const rec = db.get("config", k);
      const id = rec ? rec.credId : null;
      const ch = crypto.getRandomValues(new Uint8Array(32));
      try {
        if (id) {
          await navigator.credentials.get({
            publicKey: {
              challenge: ch,
              allowCredentials: [{ id: Uint8Array.from(atob(id), c => c.charCodeAt(0)), type: "public-key" }],
              userVerification: "required", timeout: 60000
            }
          });
          return true;
        }
        const c = await navigator.credentials.create({
          publicKey: {
            challenge: ch,
            rp: { name: "Victory Tuition Centre" },
            user: { id: new TextEncoder().encode(t.id), name: t.name, displayName: t.name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000
          }
        });
        await db.set("config", k, { credId: btoa(String.fromCharCode(...new Uint8Array(c.rawId))) });
        return true;
      } catch (e) { return false; }
    }

        if (k === "in") {
          if (cur) return toast("Already checked in at " + cur.in);
          await db.set("staffatt", id, { tid: t.id, name: t.name, date: d, in: now(), out: "", method: m, ts: Date.now() });
        } else {
          if (!cur) return toast("Check in first.");
          if (cur.out) return toast("Already checked out at " + cur.out);
          await db.update("staffatt", id, { out: now() });
        }
        toast("✓ " + t.name + " checked " + k + " at " + now());
        $("#tpi").value = "";
      } catch (e) { fail(e); }
    }

    function addF() {
      const s = S.find(x => x.id === $("#fs").value);
      const amt = +$("#fa").value;
      const mo = $("#fm").value;
      if (!s || !amt || !mo) return toast("Pick a student, amount and month.");
      const rc = "R" + Date.now().toString().slice(-7);
      const bal = Math.max(0, (s.fee || 0) - monthSum(s.id, mo) - amt);
      db.add("fees", { sid: s.id, name: s.name, amount: amt, month: mo, method: $("#fx").value, rc, ts: Date.now() })
        .then(() => {
          db.add("portal_fees", { code: s.code, month: mo, amount: amt, rc, ts: Date.now() });
          alertP(s, `Payment received: LKR ${amt.toLocaleString()} for ${s.name} (${mo}). Receipt ${rc}. Balance: LKR ${bal.toLocaleString()}.`);
          $("#fa").value = "";
          toast("Receipt " + rc + " saved to cloud.");
        }).catch(fail);
    }

    async function notifyMonthAndSend() {
      const m = $("#nm2").value;
      if (!m) return;
      const promises = [];
      const gradeStudents = S.filter(s => (s.grade || "Grade 6") === selectedGrade);
      gradeStudents.forEach(s => {
        const b = (s.fee || 0) - monthSum(s.id, m);
        const key = s.id + "_" + m;
        if (b > 0 && !O.some(o => o.key === key)) {
          promises.push(db.add("alerts", {
            sid: s.id,
            to: s.phone,
            parent: s.parent,
            msg: `Fee reminder: ${s.name}’s fee for ${m} is not paid yet. Balance LKR ${b.toLocaleString()}. Thank you – Victory Tuition Centre.`,
            key: key,
            status: "pending",
            ts: Date.now()
          }));
        }
      });
      await Promise.all(promises);
      go("al");
      setTimeout(() => startBulkWhatsApp(), 300);
    }

    function startBulkWhatsApp() {
      const pending = O.filter(o => o.status !== "sent").sort((a, b) => a.ts - b.ts);
      if (!pending.length) return toast("No pending WhatsApp alerts to send!");

      let idx = 0;
      const total = pending.length;
      const root = $("#modal-root");

      function openCurrent() {
        if (idx >= total) {
          closeModal();
          toast("✅ All " + total + " WhatsApp alerts launched!");
          return;
        }
        const item = pending[idx];
        const url = `https://wa.me/${wa(item.to)}?text=${encodeURIComponent(item.msg)}`;
        window.open(url, "_blank");
        db.update("alerts", item.id, { status: "sent" }).catch(fail);
        idx++;
        updateModalUI();
      }

      function updateModalUI() {
        const currentItem = pending[idx];
        root.innerHTML = `<div class="ov">
          <div class="card qc" onclick="event.stopPropagation()">
            <h3>🚀 Bulk WhatsApp Sender</h3>
            <p>Sending <b>${idx} of ${total}</b> messages…</p>
            <div class="storage-bar"><div class="storage-fill" style="width:${Math.round((idx / total) * 100)}%"></div></div>
            ${currentItem ? `<p class="mu" style="font-size:13px">Next: <b>${esc(currentItem.parent || currentItem.to)}</b></p>` : `<p class="mu">Finishing up…</p>`}
            <small style="display:block;margin-bottom:12px">Note: Allow popups in your browser if asked, so all WhatsApp tabs open smoothly.</small>
            <div class="row">
              <button class="btn btn-wa" id="bulk-next-btn">${idx < total ? "Send Next Now ➔" : "Done"}</button>
              <button class="btn2" onclick="closeModal()">Stop</button>
            </div>
          </div>
        </div>`;
        const nextBtn = $("#bulk-next-btn");
        if (nextBtn) nextBtn.onclick = openCurrent;
      }

      openCurrent();
      bulkInterval = setInterval(() => {
        if (idx >= total) {
          closeModal();
          toast("✅ All " + total + " WhatsApp alerts launched!");
        } else {
          openCurrent();
        }
      }, 2200);
    }

    async function markAllAlertsSent() {
      const pending = O.filter(o => o.status !== "sent");
      if (!pending.length) return;
      askConfirm(`Mark all ${pending.length} pending alerts as sent?`, async () => {
        const updates = {};
        pending.forEach(o => {
          updates[`alerts/${o.id}/status`] = "sent";
          CACHE.alerts.set(o.id, { ...o, status: "sent" });
        });
        syncArrays();
        await rtdb.ref().update(updates);
        toast("All alerts marked as sent.");
      });
    }

    function addE() {
      const s = S.find(x => x.id === $("#es").value);
      const k = +$("#ek").value;
      const o = +$("#eo").value;
      const x = $("#en").value.trim();
      const j = $("#ej").value.trim();
      if (!s || !x || !o || $("#ek").value === "") return toast("Choose a student and fill exam, marks and total.");
      db.add("exams", { sid: s.id, name: s.name, grade: s.grade || selectedGrade, exam: x, subject: j, marks: k, total: o, ts: Date.now() })
        .then(() => {
          db.add("portal_exams", { code: s.code, exam: x, subject: j, marks: k, total: o, ts: Date.now() });
          alertP(s, `Exam result: ${s.name} scored ${k}/${o} (${Math.round(k / o * 100)}%) in ${j || "the test"} – ${x}.`);
          $("#en").value = ""; $("#ej").value = ""; $("#ek").value = "";
          toast("Result saved to cloud.");
        }).catch(fail);
    }

    function addX() {
      const t = $("#xt").value.trim(), a = +$("#xa").value, d = $("#xd").value;
      if (!t || !a || !d) return toast("Add what it was for, the amount and date.");
      db.add("expenses", { title: t, amount: a, cat: $("#xc").value, date: d, ts: Date.now() })
        .then(() => { $("#xt").value = ""; $("#xa").value = ""; toast("Expense saved to cloud."); }).catch(fail);
    }

    function addP() {
      const t = $("#pt").value.trim(), a = +$("#pa").value, d = $("#pd").value;
      if (!t || !a || !d) return toast("Add teacher name, amount and date.");
      db.add("tpay", { teacher: t, amount: a, note: $("#pn").value.trim(), date: d, ts: Date.now() })
        .then(() => { $("#pt").value = ""; $("#pa").value = ""; $("#pn").value = ""; toast("Payment saved to cloud."); }).catch(fail);
    }

    function sent(id) { db.update("alerts", id, { status: "sent" }).catch(fail); }

    function openCode(passedCode) {
      const c = (passedCode || ($("#sc") && $("#sc").value) || "").trim().toUpperCase();
      const el = $("#sdata");
      if (!c || !el) return;
      currentPortalCode = c;
      const inf = db.get("portal_info", c);
      if (!inf) {
        el.innerHTML = "<div class='card'><p class='mu'>Code not found. Check your QR card.</p></div>";
        return;
      }
      const y = today().slice(0, 4);
      const fees = db.getAll("portal_fees").filter(x => x.code === c);
      const at = db.getAll("portal_att").filter(x => x.code === c && x.date.slice(0, 7) === month()).sort((p, q) => q.date.localeCompare(p.date));
      const ex = db.getAll("portal_exams").filter(x => x.code === c).sort((p, q) => q.ts - p.ts);

      el.innerHTML = `
        <div class="hero">
          <div><small style="color:#c9d4f5">Welcome</small><h2>${esc(inf.name)}</h2><small style="color:#c9d4f5">${esc(inf.grade || "Grade 6")}</small></div>
          <div class="clk">${at.length} days</div>
        </div>
        <div class="card">
          <h3>Fee months ${y}</h3>
          <div class="mg">
            ${MN.map((n, j) => {
              const k = y + "-" + String(j + 1).padStart(2, "0");
              const p = sum(fees.filter(x => x.month === k), x => x.amount);
              const st = k > month() ? "" : p >= (inf.fee || 1) ? "ok" : p > 0 ? "hf" : "no";
              return `<div class="m ${st}"><b>${n}</b><small>${st === "ok" ? "Paid" : st === "hf" ? "Part" : st === "no" ? "Unpaid" : "–"}</small></div>`;
            }).join("")}
          </div>
        </div>
        <div class="card tw">
          <h3>Attendance this month</h3>
          <table>
            <tr><th>Date</th><th>In</th><th>Out</th></tr>
            ${at.map(x => `<tr><td>${x.date}</td><td>${x.in}</td><td>${x.out || "–"}</td></tr>`).join("") || `<tr><td colspan="3" class="mu">No attendance yet.</td></tr>`}
          </table>
        </div>
        <div class="card tw">
          <h3>Exam results</h3>
          <table>
            <tr><th>Exam</th><th>Subject</th><th>Marks</th></tr>
            ${ex.map(x => `<tr><td>${esc(x.exam)}</td><td>${esc(x.subject)}</td><td>${x.marks}/${x.total}</td></tr>`).join("") || `<tr><td colspan="3" class="mu">No results yet.</td></tr>`}
          </table>
        </div>`;
    }

    function updateStorageStats() {
      const infoEl = $("#storage-info");
      if (!infoEl) return;
      let totalRecords = 0;
      STORES.forEach(st => totalRecords += CACHE[st].size);
      infoEl.textContent = `Live Firebase Cloud Active · ${totalRecords.toLocaleString()} synced records across all devices`;
    }

    function exportBackup() {
      const dump = { version: 1, exportedAt: new Date().toISOString(), stores: {} };
      STORES.forEach(st => { dump.stores[st] = Array.from(CACHE[st].values()); });
      const blob = new Blob([JSON.stringify(dump)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `Victory_Tuition_Cloud_Backup_${today()}.json`;
      a.click(); URL.revokeObjectURL(url);
      toast("Full cloud backup downloaded.");
    }

    function importBackup(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const data = JSON.parse(e.target.result);
          if (!data || !data.stores) throw new Error("Invalid backup file.");
          const updates = {};
          STORES.forEach(st => {
            updates[st] = {};
            (data.stores[st] || []).forEach(item => {
              if (item && item.id) updates[st][item.id] = item;
            });
          });
          await rtdb.ref().update(updates);
          toast("Backup restored to Live Cloud successfully!");
        } catch (err) { toast("Restore failed: " + err.message); }
        input.value = "";
      };
      reader.readAsText(file);
    }

    window.addEventListener("hashchange", () => { stopCam(); page = ""; render(); });
    setInterval(() => { const c = $("#clk"); if (c) c.textContent = new Date().toLocaleTimeString(); }, 1000);

    window.onload = async () => {
      rm = month();
      await initCloudSync();
      render();
    };
  </script>
</body>
</html>
